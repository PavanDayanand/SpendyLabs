<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before paint so a saved dark theme never flashes white.
      try {
        const saved = localStorage.getItem("spendy-theme");
        document.documentElement.dataset.theme = saved === "dark" || saved === "light"
          ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch { document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f3" />
    <meta
      name="description"
      content="Meet Spendy, a friendly iOS app that brings expenses, budgets, subscriptions, and helpful insights together. Join the beta waitlist."
    />
    <meta property="og:title" content="Spendy | Money makes sense." />
    <meta
      property="og:description"
      content="Expenses, budgets, subscriptions, and helpful insights in one friendly iOS app."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/images/spendy-ios-icon-dark.png" />
    <title>Spendy | Money makes sense.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
